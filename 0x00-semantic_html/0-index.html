<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic HTML Structure</title>
</head>
<body>
  <header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <article>
      <h1>Welcome to My Semantic HTML Page</h1>
      <section>
        <p>This is the content section inside the article. Semantic HTML helps make web pages more readable and accessible by giving meaning to each part of the content.</p>
      </section>
    </article>
  </main>

  <footer>
    <p>@copyright 2025</p>
  </footer>
</body>
</html>
